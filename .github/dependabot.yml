version: 2
updates:
  # Security and version bumps for the pnpm workspace. Grouped so a routine
  # week produces one or two PRs rather than twenty.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      dev-tooling:
        patterns:
          - '@commitlint/*'
          - 'eslint*'
          - '@typescript-eslint/*'
          - 'prettier'
          - 'husky'
          - 'lint-staged'
          - 'turbo'
          - 'vitest*'
          - '@vitest/*'
        update-types: ['minor', 'patch']
      minor-and-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directories:
      - /apps/api
      - /apps/web
      - /apps/worker
      # The image every compose service actually runs in development. Left out
      # of the original list, so it silently stayed on an older Node than the
      # three production images while appearing to be covered.
      - /infra/docker
    schedule:
      interval: monthly
    commit-message:
      prefix: build
    # Minor and patch only. Node majors are a deliberate, human decision here,
    # because Dependabot offers whatever is newest and newest is usually not
    # supported: odd majors (23, 25) never become LTS at all, and even ones are
    # "Current" for roughly six months before they do. #5/#8/#9 proposed 25 and
    # #18–#21 proposed 26 within minutes of adopting 24 — neither was LTS.
    #
    # Security patches within the pinned major still arrive, which is the part
    # that must not be missed. To take the next major, bump the FROM lines, the
    # engines fields and CI's NODE_VERSION together — see #17 for the full list
    # of seven pins that have to move as one.
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
