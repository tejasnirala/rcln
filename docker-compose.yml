name: rcln

# =============================================================================
# Full development stack. Nothing needs to be installed on the host except
# Docker itself — no node, no pnpm, no postgres.
#
#   docker compose up              start everything
#   docker compose logs -f api     follow one service
#   docker compose exec api sh     shell inside a container
#   docker compose down -v         wipe volumes and start clean
#
# Source is bind-mounted, so editing in VS Code reloads the running service.
#
# THE NODE_MODULES RULE
# Every service declares named volumes over each node_modules path. Without
# them the bind mount of the repo would shadow the container's node_modules
# with the host's — which is either empty (nothing runs) or macOS binaries
# (native modules segfault in a linux container). The volumes win because a
# more specific mount path takes precedence over a less specific one.
# =============================================================================

# api, web, worker and migrate all run the SAME image — identical workspace,
# only the command differs. Sharing one `image:` tag means compose builds it
# once instead of producing four near-identical images, and it removes a real
# footgun: `docker compose build api` would otherwise leave the other three
# services running a stale image.
x-dev-image: &dev-image rcln-dev:local

x-dev-build: &dev-build
  context: .
  dockerfile: infra/docker/Dockerfile.dev

x-dev-env: &dev-env
  NODE_ENV: development
  # pnpm aborts rather than touch node_modules when it cannot prompt.
  CI: 'true'
  # Service names, not localhost — these override whatever .env says.
  DATABASE_URL: postgresql://rcln_app:app_password@postgres:5432/rcln?schema=public
  DIRECT_DATABASE_URL: postgresql://rcln_owner:owner_password@postgres:5432/rcln?schema=public
  REDIS_URL: redis://redis:6379
  ROOT_DOMAIN: ${ROOT_DOMAIN:-lvh.me}
  LOG_LEVEL: ${LOG_LEVEL:-debug}
  # Confirms any email address or phone number, because neither SES nor TRAI DLT
  # can deliver a real one yet. It lives on the DEV anchor deliberately: nothing
  # outside this file sets it, the API refuses to boot with it in production, and
  # it logs nobody in. The web reads it only to print the hint on /verify.
  DEV_MASTER_VERIFICATION_CODE: ${DEV_MASTER_VERIFICATION_CODE:-123456}
  # Email goes to Mailpit, not to the log. An invitation token is handed to the
  # sender and to nobody else — the column holds a digest — so before this the
  # only way to open an invitation was to copy a URL out of a JSON log line.
  # Read them at http://localhost:8025. Mailpit delivers to nobody; nothing here
  # can reach a real address. Set EMAIL_PROVIDER=console to go back to logging.
  #
  # Pinned, not defaulted — like DATABASE_URL above, these override whatever
  # .env says. Inside compose there is a Mailpit on the network and no reason to
  # use anything else; `.env` carries the settings for a native run, where there
  # is no Mailpit and `console` is correct.
  EMAIL_PROVIDER: smtp
  # Quoted display name: an unquoted `(dev)` is an RFC 5322 comment and vanishes.
  EMAIL_FROM: '"rcln dev" <noreply@rcln.local>'
  # Where DocumentService writes.
  #
  # ⚠️ ONE VARIABLE, USED ON BOTH SIDES OF A BIND MOUNT, SO THE PATH IS THE SAME
  #   ON THE HOST AND IN EVERY CONTAINER. Change it in `.env` and the documents
  #   move — no compose edit, no second setting to keep in sync, and the folder
  #   is a real one you can open in Finder.
  #
  #   Mounted identically in the API and the worker, because when PDF generation
  #   moves onto a queue the worker writes the bytes and the API serves them.
  #
  # ⚠️ IT MUST BE ABSOLUTE, AND UNDER A PATH DOCKER DESKTOP SHARES.
  #   Docker Desktop shares /Users by default and NOT /var/lib. Pointing this at
  #   an unshared path does NOT fail — Docker silently creates the directory
  #   inside its own Linux VM, the app writes there happily, and the files never
  #   appear on the host. Measured: a bind mount of /var/lib/rcln-mount-test
  #   returned success and left nothing on the Mac. If you want a path outside
  #   your home directory, add it to Docker Desktop → Settings → Resources →
  #   File sharing first.
  STORAGE_LOCAL_PATH: ${STORAGE_LOCAL_PATH:-${HOME}/rcln/documents}
  SMTP_HOST: mailpit
  SMTP_PORT: '1025'
  SMTP_SECURE: 'false'
  SMTP_USER: ''
  SMTP_PASSWORD: ''
  # File watching: OFF by default.
  #
  # Polling was the default here and it OOM-killed the web container — a polling
  # watcher stats the whole bind-mounted tree on every tick, and Turbopack's
  # compile on top of that exceeded the container's memory. Docker Desktop's
  # VirtioFS propagates native fs events correctly, so polling is not needed.
  #
  # Turn it on only if edits genuinely stop triggering reloads:
  #   WATCH_POLL=true docker compose up
  CHOKIDAR_USEPOLLING: ${WATCH_POLL:-false}
  WATCHPACK_POLLING: ${WATCH_POLL:-false}

services:
  # ==========================================================================
  # Postgres 16 — RLS, partitioning, gist exclusion constraints, pg_trgm
  # ==========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: rcln-postgres
    restart: unless-stopped
    ports:
      - '${DB_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_ROOT_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-rcln}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Runs once on first boot: creates the owner/app role split RLS depends on.
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d ${DB_NAME:-rcln}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [rcln]

  # ==========================================================================
  # Redis 7 — tenant cache, permission cache, rate limits, locks, BullMQ
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: rcln-redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    # noeviction: a BullMQ job evicted under memory pressure is a lost
    # notification. Cache keys carry TTLs instead of relying on eviction.
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [rcln]

  # ==========================================================================
  # Mailpit — catches every outbound email in dev. UI: http://localhost:8025
  # ==========================================================================
  mailpit:
    image: axllent/mailpit:latest
    container_name: rcln-mailpit
    restart: unless-stopped
    ports:
      - '8025:8025'
      - '1025:1025'
    networks: [rcln]

  # ==========================================================================
  # Migrate + seed. Runs to completion, then exits.
  #
  # A one-shot service rather than something baked into the api's startup:
  # migrations must run exactly once, not once per replica, and they connect as
  # the OWNER role while the api connects as the app role.
  # ==========================================================================
  migrate:
    build: *dev-build
    image: *dev-image
    container_name: rcln-migrate
    environment:
      <<: *dev-env
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-at-least-32-characters-long}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-superadmin@rcln.local}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-ChangeMe!SuperAdmin1}
      SUPERADMIN_NAME: ${SUPERADMIN_NAME:-Platform Super Admin}
    volumes:
      - .:/app
      - workspace_node_modules:/app/node_modules
      - api_node_modules:/app/apps/api/node_modules
      - web_node_modules:/app/apps/web/node_modules
      - worker_node_modules:/app/apps/worker/node_modules
      - db_node_modules:/app/packages/db/node_modules
      - contracts_node_modules:/app/packages/contracts/node_modules
      - permissions_node_modules:/app/packages/permissions/node_modules
      - config_node_modules:/app/packages/config/node_modules
      - db_generated:/app/packages/db/generated
    # The last step builds `rcl_testing` — the database `pnpm test` writes to —
    # and brings it level with the development one. It runs HERE rather than
    # from the test command so that a schema change reaches both databases in
    # the same `docker compose up`: a test database one migration behind fails
    # in ways that read as application bugs. Idempotent, and a few seconds after
    # the first run. See packages/db/scripts/test-database.ts.
    command: >
      sh -c "pnpm --filter @rcln/db exec prisma migrate deploy &&
             pnpm --filter @rcln/db run grants &&
             pnpm --filter @rcln/db run seed &&
             pnpm --filter @rcln/db run rls:check &&
             pnpm --filter @rcln/db run test:db:setup"
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    networks: [rcln]

  # ==========================================================================
  # API — Express 5, hot reloaded by tsx watch
  # ==========================================================================
  api:
    build: *dev-build
    image: *dev-image
    container_name: rcln-api
    environment:
      <<: *dev-env
      PORT: 5000
      HOST: 0.0.0.0
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-at-least-32-characters-long}
      WEB_URL: http://${ROOT_DOMAIN:-lvh.me}:3000
      CORS_ORIGINS: http://localhost:3000,http://${ROOT_DOMAIN:-lvh.me}:3000
    ports:
      - '${API_PORT:-5000}:5000'
    volumes:
      - .:/app
      - workspace_node_modules:/app/node_modules
      - api_node_modules:/app/apps/api/node_modules
      - web_node_modules:/app/apps/web/node_modules
      - worker_node_modules:/app/apps/worker/node_modules
      - db_node_modules:/app/packages/db/node_modules
      - contracts_node_modules:/app/packages/contracts/node_modules
      - permissions_node_modules:/app/packages/permissions/node_modules
      - config_node_modules:/app/packages/config/node_modules
      - db_generated:/app/packages/db/generated
      # Stored documents — a real folder on the host, mounted at the SAME path
      # inside the container, so `STORAGE_LOCAL_PATH` alone decides where they
      # live. See the anchor above for why the path must be one Docker Desktop
      # shares. Outside /app on purpose: an invoice PDF names a patient, and a
      # directory inside a git working tree is one `git add -f` from being
      # published permanently.
      - ${STORAGE_LOCAL_PATH:-${HOME}/rcln/documents}:${STORAGE_LOCAL_PATH:-${HOME}/rcln/documents}
    command: pnpm --filter @rcln/api run dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      # Started, not healthy: the api sends mail long after boot, and a mail
      # catcher that is down must not hold up the API — a failed send is logged,
      # never thrown (see services/notification/smtp.sender.ts).
      mailpit:
        condition: service_started
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:5000/api/v1/health']
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 5
    # ⚠️ RAISED FROM 1g FOR `pnpm validate`, NOT FOR THE RUNNING SERVER.
    #   The api serves requests in about 230m. What needs the headroom is the
    #   command CLAUDE.md tells you to run before finishing a task: turbo fans
    #   out tsc and eslint across 14 packages, and each holds a whole type graph.
    #   At 1g it was killed outright — exit 137 from the suite, 134 from tsc —
    #   which reads as a code failure and is not one.
    #
    #   3g, not 2g, and the extra gigabyte is the point. At a 2g ceiling the same
    #   command peaked at 1.993g: it passed or was killed depending on how many
    #   packages turbo happened to run at once. A limit that fails intermittently
    #   is worse than one that fails always, because the next person debugs their
    #   code instead of the ceiling.
    #
    #   Given 3g it peaks at 2.29g, not 1.99g — node sizes its heap from the
    #   cgroup limit, so the lower number was a squeeze, not a comfortable fit.
    #   Measured over four consecutive `pnpm validate --force` runs.
    #
    #   1g was never actually exercised: until the CI build fix, 28 of 34 api
    #   suites died on module resolution in the first second and allocated
    #   nothing. The ceiling only became real once the tests started running.
    #
    #   A ceiling is not a reservation. api + web + worker now total 8g of the
    #   7.75g Docker gets, which is deliberate over-subscription: measured
    #   concurrent use is ~2.8g, and validate does not run during a web build.
    #   No browser ever launches here — that is still the worker's job, see
    #   apps/worker/src/documents/browser.ts.
    mem_limit: 3g
    networks: [rcln]

  # ==========================================================================
  # Web — Next.js 16 dev server
  # ==========================================================================
  web:
    build: *dev-build
    image: *dev-image
    container_name: rcln-web
    environment:
      <<: *dev-env
      PORT: 3000
      NEXT_PUBLIC_ROOT_DOMAIN: ${ROOT_DOMAIN:-lvh.me}
      # Resolved by the BROWSER, which runs on the host — so localhost, not the
      # compose service name.
      NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-5000}
      # Resolved by the WEB CONTAINER — Server Actions run here, where localhost
      # is this container and not the API. Same string, different machine, which
      # is why it needs its own variable instead of reusing the public one.
      API_INTERNAL_URL: http://api:5000
      WAIT_FOR_DB: 'false'
    ports:
      - '${WEB_PORT:-3000}:3000'
    volumes:
      - .:/app
      - workspace_node_modules:/app/node_modules
      - api_node_modules:/app/apps/api/node_modules
      - web_node_modules:/app/apps/web/node_modules
      - worker_node_modules:/app/apps/worker/node_modules
      - db_node_modules:/app/packages/db/node_modules
      - contracts_node_modules:/app/packages/contracts/node_modules
      - permissions_node_modules:/app/packages/permissions/node_modules
      - config_node_modules:/app/packages/config/node_modules
      - db_generated:/app/packages/db/generated
      # .next is huge and container-owned; keeping it off the bind mount is a
      # large win for rebuild speed on macOS.
      - web_next:/app/apps/web/.next
    command: pnpm --filter @rcln/web run dev
    depends_on:
      api:
        condition: service_started
    # Turbopack is the memory-hungry process in this stack. Capping each service
    # means an over-eager build fails one container instead of the whole host.
    mem_limit: 3g
    networks: [rcln]

  # ==========================================================================
  # Worker — BullMQ processors
  # ==========================================================================
  worker:
    build: *dev-build
    image: *dev-image
    container_name: rcln-worker
    environment:
      <<: *dev-env
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-at-least-32-characters-long}
    volumes:
      - .:/app
      - workspace_node_modules:/app/node_modules
      - api_node_modules:/app/apps/api/node_modules
      - web_node_modules:/app/apps/web/node_modules
      - worker_node_modules:/app/apps/worker/node_modules
      - db_node_modules:/app/packages/db/node_modules
      - contracts_node_modules:/app/packages/contracts/node_modules
      - permissions_node_modules:/app/packages/permissions/node_modules
      - config_node_modules:/app/packages/config/node_modules
      - db_generated:/app/packages/db/generated
      # ⚠️ THE SAME FOLDER AT THE SAME PATH AS THE API. When PDF generation
      #   moves onto the queue (invoice engine, phase 11), the worker writes the
      #   bytes and the API serves them. Mount either one differently and the
      #   download 404s while every row insists the document exists.
      - ${STORAGE_LOCAL_PATH:-${HOME}/rcln/documents}:${STORAGE_LOCAL_PATH:-${HOME}/rcln/documents}
    command: pnpm --filter @rcln/worker run dev
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # ⚠️ RAISED FROM 768m FOR CHROMIUM, AND THIS IS THE WHOLE REASON THE PDF
    #   RENDER LIVES HERE RATHER THAN IN THE API. A browser plus one renderer
    #   process needs roughly a gigabyte on a document with a long table; 768m
    #   killed it mid-render, which surfaces as a "target closed" naming nothing.
    #   The api container never launches a browser — see the header of
    #   apps/worker/src/documents/browser.ts. Its own limit was later raised to
    #   2g for `pnpm validate`, which is a typechecking cost, not a Chromium one.
    #
    #   Document rendering is deliberately concurrency 1 (apps/worker/src/index.ts),
    #   so this is sized for ONE browser, not five.
    mem_limit: 2g
    # Chromium's renderer uses /dev/shm, which Docker caps at 64MB by default.
    # The launch flags pass --disable-dev-shm-usage as well; both are cheap and
    # the failure mode of neither is legible.
    shm_size: 512m
    networks: [rcln]

networks:
  rcln:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  # NOTE: stored documents are deliberately NOT a named volume. They live in a
  # real host folder bind-mounted at the same path — see STORAGE_LOCAL_PATH on
  # the dev-env anchor. That keeps them browsable in Finder and makes the
  # location one variable rather than a variable plus a mount.
  #
  # Consequence worth knowing: `docker compose down -v` does NOT delete them,
  # unlike everything below. Removing documents is a host `rm`.
  web_next:
  db_generated:
  workspace_node_modules:
  api_node_modules:
  web_node_modules:
  worker_node_modules:
  db_node_modules:
  contracts_node_modules:
  permissions_node_modules:
  config_node_modules:
